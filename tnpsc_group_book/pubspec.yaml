name: tnpsc_group_book
description: "TNPSC Master Flutter application"
publish_to: 'none' # private package

# Version Change
version: 1.1.3+16

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_remote_config: ^6.5.5
  google_nav_bar: ^5.0.6
  google_mobile_ads: ^9.0.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  bcrypt: ^1.1.3
  flutter_secure_storage: ^10.3.1
  flutter_tts: ^4.2.5
  intl: ^0.20.2
  url_launcher: ^6.3.0
  lottie: ^3.5.1
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  animated_text_kit: ^4.2.2
  flutter_local_notifications: ^22.0.0
  http: ^1.2.0
  googleapis_auth: ^2.3.1
  timezone: ^0.11.0
  package_info_plus: ^10.2.1
  flutter_staggered_animations: ^1.1.1
  scrollable_positioned_list: ^0.3.8
  cloud_functions: ^6.3.5
  flutter_widget_recorder: ^0.1.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#02091A"
  image: asset/images/logo_splash.png
  color_dark: "#02091A"
  android_12:
    image: asset/images/logo_splash.png
    color: "#02091A"
    color_dark: "#02091A"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - asset/images/
